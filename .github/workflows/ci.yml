name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Vérifier la syntaxe des sources
        run: npm run check
      - name: Lancer les tests
        run: npm test

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Construire l'archive de l'extension
        run: npm run zip
      - uses: actions/upload-artifact@v5
        with:
          name: extension
          path: dist/extension.zip
