<div class="panel" id="panel">
  <header>
    <svg class="logo" viewBox="0 0 128 128" aria-hidden="true"><defs><linearGradient id="logo-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3568d8"/><stop offset="1" stop-color="#1e3f93"/></linearGradient><linearGradient id="logo-rates" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4c04a"/><stop offset=".55" stop-color="#ea7a3a"/><stop offset="1" stop-color="#d23e36"/></linearGradient></defs><rect width="128" height="128" rx="28" fill="url(#logo-sky)"/><rect x="34" y="82" width="60" height="14" rx="7" fill="url(#logo-rates)"/><path d="M22 100 V84 C22 56 40 36 64 36 S106 56 106 84 V100" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="site-info" class="meta"></span>
    <details class="settings" id="preferences">
      <summary class="icon-summary" data-i18n-title="prefs_title" data-i18n-aria-label="prefs_title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </summary>
      <div class="popover">
        <label class="field"><span data-i18n="field_language"></span>
          <select id="language">
            <option value="auto" data-i18n="lang_auto"></option>
            <option value="en">English</option>
            <option value="fr">Français</option>
          </select>
        </label>
        <label class="check"><input id="show-log" type="checkbox" checked> <span data-i18n="show_log_label"></span></label>
      </div>
    </details>
  </header>

  <div class="body" id="body">
    <div id="unsupported" class="unsupported" hidden>
      <p data-i18n="unsupported_title"></p>
      <p data-i18n="unsupported_intro"></p>
      <ul>
        <li><a href="https://www.airbnb.fr/multicalendar/" target="_blank" rel="noopener">Airbnb</a><span data-i18n="unsupported_airbnb_kind"></span><span class="url" data-i18n="unsupported_airbnb_url"></span></li>
        <li><a href="https://www.abritel.fr/p/calendar/" target="_blank" rel="noopener">Abritel / Vrbo</a><span data-i18n="unsupported_abritel_kind"></span><span class="url" data-i18n="unsupported_abritel_url"></span></li>
      </ul>
    </div>
    <div id="steps">
    <p id="notice" class="notice" hidden></p>
    <section>
      <h2><span class="step">1 –</span><span data-i18n="step1_title"></span></h2>
      <div class="row">
        <label class="field"><span data-i18n="field_year"></span> <input id="year" type="number" min="2020" max="2100"></label>
        <button id="read" type="button" data-i18n="btn_read"></button>
        <label class="file"><span data-i18n="btn_import"></span><input id="import" type="file" accept=".bnbprices,.json,application/json"></label>
      </div>
      <p class="hint" data-i18n="import_hint"></p>
      <div id="read-result" class="card" hidden>
        <div class="card-head">
          <p id="read-summary" class="hint"></p>
          <span class="help">
            <button id="export" type="button" class="icon" disabled data-i18n-aria-label="export_tip" aria-describedby="export-help">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 19h14"/></svg>
            </button>
            <span id="export-help" role="tooltip" class="tip" data-i18n="export_tip"></span>
          </span>
        </div>
        <div id="read-grid" class="year-grid" hidden></div>
        <p id="read-notice" class="notice" hidden></p>
      </div>
    </section>

    <div id="after-read" class="locked" inert>
    <section>
      <div class="row inline-step">
        <h2><span class="step">2 –</span><label for="base-price" data-i18n="step2_title"></label></h2>
        <input id="base-price" type="number" min="0" step="1">
        <span class="help">
          <button type="button" class="info" data-i18n-aria-label="base_help_aria" aria-describedby="base-help">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
          </button>
          <span id="base-help" role="tooltip" class="tip" data-i18n="base_help_tip"></span>
        </span>
        <span id="base-hint" class="hint"></span>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2><span class="step">3 –</span><span data-i18n="step3_title"></span></h2>
        <details class="settings" id="settings">
          <summary class="icon-summary" data-i18n-title="settings_title" data-i18n-aria-label="settings_title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </summary>
          <div class="popover">
            <label class="field"><span data-i18n="field_factor"></span> <input id="factor" type="text" inputmode="decimal" value="1" data-i18n-placeholder="factor_placeholder"></label>
            <label class="field"><span data-i18n="field_rounding"></span>
              <select id="rounding">
                <option value="1" data-i18n="rounding_unit"></option>
                <option value="10" data-i18n="rounding_ten"></option>
              </select>
            </label>
            <div class="field-group">
              <span class="field-label" data-i18n="special_days_label"></span>
              <div class="days" id="special-days">
                <label class="check"><input type="checkbox" value="1"> <span data-i18n="wd_short_1"></span></label>
                <label class="check"><input type="checkbox" value="2"> <span data-i18n="wd_short_2"></span></label>
                <label class="check"><input type="checkbox" value="3"> <span data-i18n="wd_short_3"></span></label>
                <label class="check"><input type="checkbox" value="4"> <span data-i18n="wd_short_4"></span></label>
                <label class="check"><input type="checkbox" value="5"> <span data-i18n="wd_short_5"></span></label>
                <label class="check"><input type="checkbox" value="6" checked> <span data-i18n="wd_short_6"></span></label>
                <label class="check"><input type="checkbox" value="0"> <span data-i18n="wd_short_0"></span></label>
              </div>
              <p class="hint" data-i18n="special_days_hint"></p>
            </div>
            <div class="field-group">
              <span class="field-label" data-i18n="field_countries"></span>
              <div class="chips" id="countries"></div>
              <select id="country-add"></select>
              <p class="hint" data-i18n="countries_hint"></p>
            </div>
          </div>
        </details>
      </div>
      <div class="row">
        <select id="mode">
          <option value="project"></option>
          <option value="as-is"></option>
        </select>
        <label class="field" id="target-year-field"><span data-i18n="field_target"></span> <input id="target-year" type="number" min="2020" max="2100"></label>
      </div>
      <div class="row">
        <label class="check"><input id="overwrite" type="checkbox"> <span data-i18n="overwrite_label"></span></label>
      </div>
      <div class="row">
        <button id="plan" type="button" disabled data-i18n="btn_plan"></button>
      </div>
      <p id="plan-summary" class="hint"></p>
      <div id="plan-grid" class="year-grid" hidden></div>
      <details id="skipped-details" hidden>
        <summary data-i18n="skipped_title"></summary>
        <ul id="skipped-list"></ul>
      </details>
      <details id="rules-details" hidden>
        <summary data-i18n="rules_title"></summary>
        <table id="rules-table"><thead><tr><th data-i18n="th_period"></th><th class="num" data-i18n="th_price"></th><th class="num" data-i18n="th_nights"></th><th class="num"><span data-i18n="th_share"></span>
          <span class="help">
            <button type="button" class="info" data-i18n-aria-label="share_help_aria" aria-describedby="share-help">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
            </button>
            <span id="share-help" role="tooltip" class="tip" data-i18n="share_help_tip"></span>
          </span>
        </th></tr></thead><tbody></tbody></table>
      </details>
      <div class="row apply-row">
        <button id="apply" type="button" disabled class="primary" data-i18n="btn_apply"></button>
        <button id="apply-selection" type="button" disabled data-i18n="btn_apply_selection"></button>
        <button id="pause" type="button" hidden data-i18n="btn_pause"></button>
        <button id="stop" type="button" hidden data-i18n="btn_stop"></button>
      </div>
      <div id="progress" class="progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="track"><i></i></div>
        <span class="count"></span>
      </div>
      <p id="apply-hint" class="hint"></p>
    </section>
    </div>

    </div>
    <section id="journal">
      <h2 data-i18n="journal_title"></h2>
      <pre id="log" data-i18n-empty="log_empty"></pre>
    </section>
    <p class="feedback"><span data-i18n="feedback_prompt"></span> <a id="feedback" href="#" target="_blank" rel="noopener" data-i18n="feedback_link"></a></p>
  </div>
</div>
