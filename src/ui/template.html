<div class="panel" id="panel">
  <header id="drag-handle">
    <span class="brand">BnB Calendar Prices Sync</span>
    <span id="site-info" class="meta"></span>
    <span class="spacer"></span>
    <button id="collapse" type="button" class="icon" title="Réduire" aria-label="Réduire">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
    <button id="close" type="button" class="icon" title="Fermer" aria-label="Fermer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <div class="body" id="body">
    <section>
      <h2><span class="step">01</span>Lire ou importer les prix</h2>
      <div class="row">
        <label class="field">Année <input id="year" type="number" min="2020" max="2100"></label>
        <button id="read" type="button">Lire le calendrier</button>
        <button id="export" type="button" disabled>Exporter JSON</button>
        <label class="file">Importer JSON <input id="import" type="file" accept="application/json"></label>
      </div>
      <p id="read-summary" class="hint"></p>
      <div id="read-grid" class="year-grid" hidden></div>
    </section>

    <section>
      <h2><span class="step">02</span>Prix de base</h2>
      <div class="row">
        <label class="field">Prix de base <input id="base-price" type="number" min="0" step="1"></label>
        <span id="base-hint" class="hint"></span>
      </div>
    </section>

    <section>
      <h2><span class="step">03</span>Reporter sur l'année suivante</h2>
      <div class="row">
        <label class="field">Vers <input id="target-year" type="number" min="2020" max="2100"></label>
        <label class="field">Coefficient <input id="factor" type="number" min="0.1" step="0.01" value="1"></label>
        <label class="field">Arrondi <input id="rounding" type="number" min="1" step="1" value="1"></label>
      </div>
      <div class="row">
        <button id="project" type="button" disabled>Calculer la projection</button>
        <button id="as-is" type="button" disabled title="Reprend les nuits chargées sans projection, sur la même année">Reprendre tels quels</button>
      </div>
      <details id="rules-details" hidden>
        <summary>Règles inférées</summary>
        <table id="rules-table"><thead><tr><th>Période</th><th class="num">Prix</th><th class="num">Nuits</th><th class="num">Cohérence</th></tr></thead><tbody></tbody></table>
      </details>
    </section>

    <section>
      <h2><span class="step">04</span>Simuler puis appliquer</h2>
      <div class="row">
        <label class="check"><input id="overwrite" type="checkbox"> Écraser aussi les prix personnalisés</label>
        <label class="field">Pause (ms) <input id="delay" type="number" min="200" step="100" value="1500"></label>
      </div>
      <div class="row">
        <button id="plan" type="button" disabled>Simuler</button>
        <button id="apply" type="button" disabled class="primary">Appliquer sur le site</button>
      </div>
      <p id="plan-summary" class="hint"></p>
      <div id="plan-grid" class="year-grid" hidden></div>
      <table id="plan-table" hidden><thead><tr><th>Du</th><th>Au</th><th class="num">Nuits</th><th class="num">Prix</th><th>État</th></tr></thead><tbody></tbody></table>
      <details id="skipped-details" hidden>
        <summary>Nuits ignorées</summary>
        <ul id="skipped-list"></ul>
      </details>
    </section>

    <section>
      <h2>Journal</h2>
      <pre id="log"></pre>
    </section>
  </div>
</div>
