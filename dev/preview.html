<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu du panneau</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body { margin: 0; min-height: 100vh; font: 14px system-ui, sans-serif; background: #fff; color: #222; }
    body.dark { background: #111; color: #ccc; }
    .fake { padding: 40px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; max-width: 720px; }
    .fake div { height: 72px; border: 1px solid #ddd; border-radius: 8px; padding: 8px; font-size: 12px; color: #888; }
    body.dark .fake div { border-color: #333; color: #666; }
</style>
</head>
<body>
<p style="padding: 24px 40px 0">Aperçu du panneau hors extension. Paramètres : <code>?dark</code>, <code>?state=empty|loaded|planned|applied</code>.</p>
<div class="fake"></div>
<script type="module">
    import { renderYearGrid, priceLevels, describeDate } from '../src/ui/yearGrid.js';
    import { eachDay, weekday } from '../src/core/index.js';

    const params = new URLSearchParams(location.search);
    const dark = params.has('dark');
    const stage = params.get('state') ?? 'applied';
    if (dark) document.body.classList.add('dark');
    document.querySelector('.fake').innerHTML = Array.from({ length: 35 }, (_, i) => `<div>${i + 1}<br>160 €</div>`).join('');

    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });
    let css = await (await fetch('../src/ui/styles.css')).text();
    if (dark) {
        const m = css.match(/@media \(prefers-color-scheme: dark\) \{\s*(:host \{[^}]*\})\s*\}/);
        css += `\n${m[1]}\n.year-grid .cell.sat { box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }`;
    }
    const style = document.createElement('style');
    style.textContent = css;
    shadow.append(style);
    const wrapper = document.createElement('div');
    wrapper.innerHTML = await (await fetch('../src/ui/template.html')).text();
    shadow.append(wrapper);
    document.body.append(host);
    const $ = (id) => shadow.getElementById(id);

    $('site-info').textContent = 'Airbnb · annonce 850769363996753698';
    $('year').value = 2026;
    $('target-year').value = 2027;
    $('base-price').value = 160;
    const log = (t, level = 'info') => {
        const line = document.createElement('span');
        line.className = `line ${level}`;
        const time = document.createElement('time');
        time.textContent = '18:42:07';
        line.append(time, document.createTextNode(t));
        $('log').append(line);
    };
    if (stage === 'empty') {
        // rien de chargé
    }
    else {
        // année 2026 : prix par saison, samedi plus cher
        const days = {};
        const season = (d) => {
            const m = Number(d.slice(5, 7));
            if (m === 2 || (m === 3 && d < '2026-03-08')) return 'hiver';
            if (m === 7 || m === 8) return 'ete';
            if (d >= '2026-12-19') return 'noel';
            if (m === 4 && d >= '2026-04-11' && d <= '2026-04-26') return 'printemps';
            return 'none';
        };
        const base = { hiver: [220, 398], ete: [178, 355], noel: [237, 398], printemps: [150, 260], none: [118, 237] };
        for (const d of eachDay('2026-01-01', '2026-12-31')) {
            const [wk, sat] = base[season(d)];
            days[d] = { price: weekday(d) === 6 ? sat : wk, reserved: d >= '2026-02-14' && d <= '2026-02-21' || d >= '2026-08-08' && d <= '2026-08-15' };
        }
        $('read-summary').textContent = '365 nuits chargées pour 2026 · lecture du site';
        const { levels, min, max } = priceLevels(days);
        const cells = {};
        for (const [date, day] of Object.entries(days)) {
            cells[date] = { level: levels[date], state: day.reserved ? 'reserved' : undefined, title: `${describeDate(date)} · ${day.price} €` };
        }
        renderYearGrid($('read-grid'), 2026, cells, { legend: [{ level: 1, label: `${min} €` }, { level: 5, label: `${max} €` }, { state: 'reserved', label: 'réservée' }] });
        $('base-hint').textContent = 'Détecté : 160 € affiché par le site · 160 € sur 213 nuits lointaines (94 %)';
        $('export').disabled = $('project').disabled = $('as-is').disabled = false;
        log('365 nuits chargées pour 2026 (lecture du site)', 'ok');
    }
    if (stage === 'planned' || stage === 'applied') {
        const rules = [
            ['Vacances d\'hiver · zones A, B, C · samedi', 398, 4, 100],
            ['Vacances d\'hiver · zones A, B, C · autres jours', 220, 24, 92],
            ['Vacances d\'été · zones A, B, C · samedi', 355, 9, 100],
            ['Vacances d\'été · zones A, B, C · autres jours', 178, 53, 96],
            ['Hors vacances · entre Noël et hiver · samedi', 237, 5, 80],
            ['Hors vacances · entre Noël et hiver · autres jours', 118, 30, 97],
        ];
        const tbody = $('rules-table').querySelector('tbody');
        for (const [k, p, n, s] of rules) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${k}</td><td class="num">${p}</td><td class="num">${n}</td><td class="num share"><i style="--w:${s}%"></i>${s} %</td>`;
            tbody.append(tr);
        }
        $('rules-details').hidden = false;
        $('rules-details').open = true;
        $('plan').disabled = false;
        $('apply').disabled = false;
        $('plan-summary').textContent = '212 nuits à modifier en 14 opérations · 96 déjà au bon prix · 57 ignorées';
        const ops = [
            ['2027-02-06', '2027-03-07', 29, 'lun/mar/mer/jeu/ven/dim 220 · sam 398'],
            ['2027-03-08', '2027-04-09', 33, 'lun/mar/mer/jeu/ven/dim 118 · sam 237'],
            ['2027-04-10', '2027-04-25', 16, 'lun/mar/mer/jeu/ven/dim 150 · sam 260'],
            ['2027-07-03', '2027-08-29', 58, 'lun/mar/mer/jeu/ven/dim 178 · sam 355'],
        ];
        const pt = $('plan-table').querySelector('tbody');
        ops.forEach(([f, t, n, p], i) => {
            const tr = document.createElement('tr');
            const st = stage === 'applied' ? (i < 2 ? ['fait', 'state state-done'] : i === 2 ? ['en cours', 'state state-busy'] : ['en attente', 'state']) : ['en attente', 'state'];
            tr.innerHTML = `<td class="date">${f}</td><td class="date">${t}</td><td class="num">${n}</td><td class="num">${p}</td><td class="${st[1]}">${st[0]}</td>`;
            pt.append(tr);
        });
        $('plan-table').hidden = false;
        const pc = {};
        for (const d of eachDay('2027-01-01', '2027-12-31')) pc[d] = { state: d < '2026-11-05' ? 'past' : 'unchanged' };
        for (const d of eachDay('2027-01-01', '2027-02-05')) pc[d] = { state: 'custom' };
        for (const d of eachDay('2027-02-13', '2027-02-20')) pc[d] = { state: 'reserved' };
        ops.forEach(([f, t], i) => {
            for (const d of eachDay(f, t)) {
                if (pc[d].state === 'reserved') continue;
                pc[d] = { state: stage === 'applied' ? (i < 2 ? 'done' : i === 2 ? 'busy' : 'pending') : 'pending' };
            }
        });
        renderYearGrid($('plan-grid'), 2027, pc, { legend: [
            { state: 'pending', label: 'à modifier' }, { state: 'done', label: 'fait' }, { state: 'unchanged', label: 'déjà au bon prix' },
            { state: 'custom', label: 'personnalisée' }, { state: 'reserved', label: 'réservée' }, { state: 'past', label: 'passée' },
        ] });
        const ul = $('skipped-list');
        for (const d of eachDay('2027-01-02', '2027-01-09')) {
            const li = document.createElement('li');
            li.textContent = `${d} · déjà personnalisée (166 au lieu de 118)`;
            ul.append(li);
        }
        $('skipped-details').hidden = false;
        log('6 règles inférées, 365 nuits projetées sur 2027', 'ok');
        log('Lecture des prix actuels de 2027 pour comparaison…');
        log('Simulation : 14 opérations, 57 nuits ignorées', 'ok');
        if (stage === 'applied') {
            log('Arrêt : Carte « Prix par nuit » introuvable dans la barre latérale', 'error');
        }
    }
</script>
</body>
</html>
