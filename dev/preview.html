<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu du panneau</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../src/ui/styles.css">
<style>
    /* Le panneau latéral de Chrome fait environ 360 px de large par défaut. */
    html { background: #888; }
    body { width: 380px; margin: 0 auto; min-height: 100vh; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
</style>
</head>
<body>
<script type="module">
    import { renderYearGrid, priceLevels, describeDate } from '../src/ui/yearGrid.js';
    import { eachDay, weekday, useLanguage, translateDom, t } from '../src/core/index.js';

    // Paramètres : ?dark, ?lang=fr|en, ?state=unsupported|empty|loaded|reading|planned|applied, &overwrite, &selected
    const params = new URLSearchParams(location.search);
    const lang = params.get('lang') ?? 'fr';
    await useLanguage(lang);
    const dark = params.has('dark');
    const stage = params.get('state') ?? 'applied';
    if (dark) {
        const css = await (await fetch('../src/ui/styles.css')).text();
        const m = css.match(/@media \(prefers-color-scheme: dark\) \{\s*(:root \{[^}]*\})\s*\}/);
        const style = document.createElement('style');
        style.textContent = `${m[1]}\n.year-grid .cell.sat { box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }`;
        document.head.append(style);
    }
    document.body.innerHTML = await (await fetch('../src/ui/template.html')).text();
    translateDom(document.body);
    const retranslate = () => {
        translateDom(document.body);
        const [projectOption, asIsOption] = document.getElementById('mode').options;
        projectOption.textContent = t('mode_project', 2026);
        asIsOption.textContent = t('mode_as_is', 2026);
    };
    retranslate();
    document.getElementById('language').value = lang;
    document.getElementById('language').addEventListener('change', async (e) => { await useLanguage(e.target.value === 'auto' ? 'fr' : e.target.value); retranslate(); });
    const $ = (id) => document.getElementById(id);

    if (stage === 'unsupported') {
        $('unsupported').hidden = false;
        $('steps').hidden = true;
    }
    $('site-info').textContent = stage === 'unsupported' ? '' : 'Airbnb · Chalet avec vue sur le Grand Bec et Courchevel';
    $('year').value = 2026;
    $('target-year').value = 2027;
    $('base-price').value = 160;
    const log = (text, level = 'info') => {
        const line = document.createElement('span');
        line.className = `line ${level}`;
        const time = document.createElement('time');
        time.textContent = '18:42:07';
        line.append(time, document.createTextNode(text));
        $('log').append(line);
    };
    if (stage === 'empty' || stage === 'unsupported') {
        // rien de chargé : les étapes suivantes restent verrouillées
    }
    else {
        $('after-read').classList.remove('locked');
        $('after-read').inert = false;
        // année 2026 : prix par saison, samedi plus cher
        const days = {};
        const season = (d) => {
            const m = Number(d.slice(5, 7));
            if (m === 2 || (m === 3 && d < '2026-03-08')) return 'hiver';
            if (m === 7 || m === 8) return 'ete';
            if (d >= '2026-12-19') return 'noel';
            if (m === 4 && d >= '2026-04-11' && d <= '2026-04-26') return 'printemps';
            return 'none';
        };
        const base = { hiver: [220, 398], ete: [178, 355], noel: [237, 398], printemps: [150, 260], none: [118, 237] };
        for (const d of eachDay('2026-01-01', '2026-12-31')) {
            const [wk, sat] = base[season(d)];
            days[d] = { price: weekday(d) === 6 ? sat : wk, reserved: d >= '2026-02-14' && d <= '2026-02-21' || d >= '2026-08-08' && d <= '2026-08-15', available: !(d >= '2026-10-01' && d <= '2026-10-10') };
        }
        $('read-summary').textContent = '365 nuits de 2026 lues sur le site, lecture terminée';
        $('read-result').hidden = false;
        const { levels, min, max } = priceLevels(days);
        const cells = {};
        for (const [date, day] of Object.entries(days)) {
            cells[date] = { level: levels[date], flags: day.reserved ? ['reserved'] : day.available === false ? ['blocked'] : [], title: `${describeDate(date)} · ${day.price} €` };
        }
        const legend = [{ scale: [min, max] }, { flags: ['reserved'], label: t('note_reserved') }, { flags: ['blocked'], label: t('note_blocked') }];
        if (stage === 'loaded') {
            // Import simulé : toutes les nuits se dévoilent une à une, puis la grille finale.
            const pending = Object.fromEntries(Object.keys(cells).map((d) => [d, { state: 'pending' }]));
            const grid = renderYearGrid($('read-grid'), 2026, pending);
            $('read-summary').textContent = t('loading_file', 'bnbridge-airbnb-2026.bnbprices');
            let cursor = performance.now();
            for (const d of Object.keys(cells).sort()) {
                cursor = Math.max(cursor, performance.now()) + 5;
                grid.update(d, cells[d], { delay: cursor - performance.now() });
            }
            setTimeout(() => {
                renderYearGrid($('read-grid'), 2026, cells, { legend });
                $('read-summary').textContent = t('days_summary', 365, 2026, t('origin_imported', 'bnbridge-airbnb-2026.bnbprices'));
            }, cursor - performance.now() + 400);
        }
        else {
            renderYearGrid($('read-grid'), 2026, cells, { legend });
        }
        $('base-hint').textContent = t('base_detected', 160);
        $('export').disabled = $('plan').disabled = false;
        log(t('days_summary', 365, 2026, t('origin_read')), 'ok');
    }
    if (stage === 'reading') {
        $('plan').disabled = true;
        $('plan-summary').textContent = t('reading_progress', 2027, 0, 12);
        const pc = {};
        for (const d of eachDay('2027-01-01', '2027-12-31')) pc[d] = { state: 'pending', title: t('cell_reading') };
        const grid = renderYearGrid($('plan-grid'), 2027, pc, { legend: planLegend() });
        $('apply-hint').textContent = t('hint_previewing');
        log(t('log_reading_current', 2027));
        // Lecture simulée : un mois toutes les 600 ms, révélé case par case.
        const specOf = (d) => d < '2027-02-06' ? { state: 'custom' } : d < '2027-03-08' ? { level: weekday(d) === 6 ? 1 : 0.4, selectable: true } : (d >= '2027-02-13' && d <= '2027-02-20') ? { state: 'ok', flags: ['reserved'] } : { state: 'ok' };
        let cursor = performance.now();
        grid.setState('2027-01-01', 'next');
        for (let m = 1; m <= 12; m++) {
            setTimeout(() => {
                $('plan-summary').textContent = t('reading_progress', 2027, m, 12);
                const mm = String(m).padStart(2, '0');
                const last = new Date(Date.UTC(2027, m, 0)).getUTCDate();
                for (const d of eachDay(`2027-${mm}-01`, `2027-${mm}-${last}`)) {
                    cursor = Math.max(cursor, performance.now()) + 14;
                    grid.update(d, specOf(d), { delay: cursor - performance.now() });
                }
                if (m < 12) {
                    setTimeout(() => grid.setState(`2027-${String(m + 1).padStart(2, '0')}-01`, 'next'), cursor - performance.now());
                }
            }, (m - 1) * 1200);
        }
    }
    if (stage === 'planned' || stage === 'applied') {
        const rules = [
            ['Vacances d\'hiver · zones A, B, C · samedi', 398, 4, 100],
            ['Vacances d\'hiver · zones A, B, C · autres jours', 220, 24, 92],
            ['Vacances d\'été · zones A, B, C · samedi', 355, 9, 100],
            ['Vacances d\'été · zones A, B, C · autres jours', 178, 53, 96],
            ['Hors vacances · entre Noël et hiver · samedi', 237, 5, 80],
            ['Hors vacances · entre Noël et hiver · autres jours', 118, 30, 97],
        ];
        const tbody = $('rules-table').querySelector('tbody');
        for (const [k, p, n, s] of rules) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${k}</td><td class="num">${p}</td><td class="num">${n}</td><td class="num share"><i style="--w:${s}%"></i>${s} %</td>`;
            tbody.append(tr);
        }
        $('rules-details').hidden = false;
        $('apply').disabled = false;
        $('plan-summary').textContent = '212 nuits à modifier en 14 opérations · 96 déjà au bon prix · 57 ignorées';
        const ops = [
            ['2027-02-06', '2027-03-07', 29, '<span class="days">autres</span> 220<br><span class="days">sam</span> 398'],
            ['2027-03-08', '2027-04-09', 33, '<span class="days">autres</span> 118<br><span class="days">sam</span> 237'],
            ['2027-04-10', '2027-04-25', 16, '<span class="days">autres</span> 150<br><span class="days">sam</span> 260'],
            ['2027-07-03', '2027-08-29', 58, '<span class="days">autres</span> 178<br><span class="days">sam</span> 355'],
        ];
        const pc = {};
        for (const d of eachDay('2027-01-01', '2027-12-31')) pc[d] = { state: 'ok' };
        const overwrite = params.has('overwrite');
        $('overwrite').checked = overwrite;
        // Niveau de prix des tarifs à appliquer, sur l'échelle de l'année projetée (118 → 398 €).
        const opPrices = [[220, 398], [118, 237], [150, 260], [178, 355]];
        const { levels: opLevels } = priceLevels(Object.fromEntries(opPrices.flat().map((p) => [p, { price: p }])));
        for (const d of eachDay('2027-01-01', '2027-02-05')) pc[d] = overwrite ? { level: opLevels[220], selectable: true, title: `${d} · 166 € → 220 € · ${t('note_custom_overwritten')}` } : { state: 'custom', title: `${d} · 166 € · ${t('note_custom_kept')}` };
        for (const d of eachDay('2027-02-13', '2027-02-20')) pc[d] = { state: 'ok', flags: ['reserved'] };
        for (const d of eachDay('2027-10-01', '2027-10-10')) pc[d] = { state: 'ok', flags: ['blocked'] };
        for (const d of eachDay('2027-01-01', '2027-01-15')) pc[d] = { ...pc[d], flags: [...(pc[d].flags ?? []), 'past'] };
        ops.forEach(([from, to], i) => {
            for (const d of eachDay(from, to)) {
                if (pc[d].flags) continue;
                const price = opPrices[i][weekday(d) === 6 ? 1 : 0];
                const planned = { level: opLevels[price], selectable: true, title: `${d} · 160 € → ${price} € · ${t('note_to_change')}` };
                pc[d] = stage === 'applied' ? (i < 2 ? { state: 'ok' } : i === 2 ? { ...planned, state: 'busy' } : planned) : planned;
            }
        });
        const selectionButton = (count) => {
            $('apply-selection').disabled = count === 0;
            $('apply-selection').textContent = count > 1 ? t('btn_apply_selection_count', count) : count === 1 ? t('btn_apply_selection_one') : t('btn_apply_selection');
        };
        const grid = renderYearGrid($('plan-grid'), 2027, pc, { legend: planLegend(), onSelect: (dates) => selectionButton(dates.length) });
        if (params.has('selected')) {
            for (const d of eachDay('2027-07-10', '2027-07-24')) $('plan-grid').querySelector(`[data-date="${d}"][data-selectable]`)?.toggleAttribute('data-selected', true);
            selectionButton(grid.selected().length);
        }
        $('apply-hint').textContent = t('hint_select');
        const ul = $('skipped-list');
        for (const d of eachDay('2027-01-02', '2027-01-09')) {
            const li = document.createElement('li');
            li.textContent = `${d} · ${t('skip_custom')}${t('skip_detail', 166, 118)}`;
            ul.append(li);
        }
        $('skipped-details').hidden = false;
        log(t('log_projected', 6, 365, 2027), 'ok');
        log(t('log_reading_current', 2027));
        log(t('log_preview', 14, 57), 'ok');
        if (stage === 'applied') {
            // Enregistrement en cours : la troisième opération est en train de s'écrire.
            $('apply').hidden = $('apply-selection').hidden = true;
            $('pause').hidden = $('stop').hidden = false;
            $('plan-summary').textContent = t('applying_op', `${t('wd_short_1')}/${t('wd_short_2')}/${t('wd_short_3')}/${t('wd_short_4')}/${t('wd_short_5')}/${t('wd_short_0')} 150 · ${t('wd_short_6')} 260`, '2027-04-10', '2027-04-25');
            $('progress').hidden = false;
            $('progress').querySelector('.track i').style.setProperty('--w', '34%');
            $('progress').querySelector('.count').textContent = t('progress_nights', 72, 212);
            $('apply-hint').textContent = '';
            log(t('applying_op', '220 · sam 398', '2027-02-06', '2027-03-07'));
            log(t('applying_op', '118 · sam 237', '2027-03-08', '2027-04-09'));
        }
    }
</script>
</body>
</html>
