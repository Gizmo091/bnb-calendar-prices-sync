<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu du panneau</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../src/ui/styles.css">
<style>
    /* Le panneau latéral de Chrome fait environ 360 px de large par défaut. */
    html { background: #888; }
    body { width: 380px; margin: 0 auto; min-height: 100vh; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
</style>
</head>
<body>
<script type="module">
    import { renderYearGrid, priceLevels, describeDate } from '../src/ui/yearGrid.js';
    import { eachDay, weekday } from '../src/core/index.js';

    // Paramètres : ?dark, ?state=unsupported|empty|loaded|reading|planned|applied
    const params = new URLSearchParams(location.search);
    const dark = params.has('dark');
    const stage = params.get('state') ?? 'applied';
    if (dark) {
        const css = await (await fetch('../src/ui/styles.css')).text();
        const m = css.match(/@media \(prefers-color-scheme: dark\) \{\s*(:root \{[^}]*\})\s*\}/);
        const style = document.createElement('style');
        style.textContent = `${m[1]}\n.year-grid .cell.sat { box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }`;
        document.head.append(style);
    }
    document.body.innerHTML = await (await fetch('../src/ui/template.html')).text();
    const $ = (id) => document.getElementById(id);

    if (stage === 'unsupported') {
        $('unsupported').hidden = false;
        $('steps').hidden = true;
    }
    $('site-info').textContent = stage === 'unsupported' ? '' : 'Airbnb · annonce 850769363996753698';
    $('year').value = 2026;
    $('target-year').value = 2027;
    $('base-price').value = 160;
    const log = (t, level = 'info') => {
        const line = document.createElement('span');
        line.className = `line ${level}`;
        const time = document.createElement('time');
        time.textContent = '18:42:07';
        line.append(time, document.createTextNode(t));
        $('log').append(line);
    };
    if (stage === 'empty' || stage === 'unsupported') {
        // rien de chargé
    }
    else {
        // année 2026 : prix par saison, samedi plus cher
        const days = {};
        const season = (d) => {
            const m = Number(d.slice(5, 7));
            if (m === 2 || (m === 3 && d < '2026-03-08')) return 'hiver';
            if (m === 7 || m === 8) return 'ete';
            if (d >= '2026-12-19') return 'noel';
            if (m === 4 && d >= '2026-04-11' && d <= '2026-04-26') return 'printemps';
            return 'none';
        };
        const base = { hiver: [220, 398], ete: [178, 355], noel: [237, 398], printemps: [150, 260], none: [118, 237] };
        for (const d of eachDay('2026-01-01', '2026-12-31')) {
            const [wk, sat] = base[season(d)];
            days[d] = { price: weekday(d) === 6 ? sat : wk, reserved: d >= '2026-02-14' && d <= '2026-02-21' || d >= '2026-08-08' && d <= '2026-08-15', available: !(d >= '2026-10-01' && d <= '2026-10-10') };
        }
        $('read-summary').textContent = '365 nuits de 2026 lues sur le site, lecture terminée';
        $('read-result').hidden = false;
        const { levels, min, max } = priceLevels(days);
        const cells = {};
        for (const [date, day] of Object.entries(days)) {
            cells[date] = { level: levels[date], flags: day.reserved ? ['reserved'] : day.available === false ? ['blocked'] : [], title: `${describeDate(date)} · ${day.price} €` };
        }
        renderYearGrid($('read-grid'), 2026, cells, { legend: [{ level: 1, label: `${min} €` }, { level: 5, label: `${max} €` }, { flags: ['reserved'], label: 'réservée' }, { flags: ['blocked'], label: 'bloquée' }] });
        $('base-hint').textContent = 'Détecté : 160 €';
        $('export').disabled = $('plan').disabled = false;
        log('365 nuits de 2026 lues sur le site, lecture terminée', 'ok');
    }
    if (stage === 'reading') {
        $('plan').disabled = true;
        $('plan-summary').textContent = 'Lecture des prix de 2027 · 4/12 mois';
        const pc = {};
        for (const d of eachDay('2027-01-01', '2027-12-31')) pc[d] = { state: 'pending', title: 'lecture en cours' };
        for (const d of eachDay('2027-01-01', '2027-04-30')) pc[d] = { state: 'ok' };
        for (const d of eachDay('2027-01-01', '2027-02-05')) pc[d] = { state: 'custom' };
        for (const d of eachDay('2027-02-06', '2027-03-07')) pc[d] = { state: 'diff' };
        for (const d of eachDay('2027-02-13', '2027-02-20')) pc[d] = { state: 'ok', flags: ['reserved'] };
        renderYearGrid($('plan-grid'), 2027, pc, { legend: [
            { state: 'ok', label: 'bon prix' }, { state: 'diff', label: 'à modifier' }, { state: 'custom', label: 'personnalisée, conservée' },
            { flags: ['reserved'], label: 'réservée' }, { state: 'ok', flags: ['past'], label: 'passée' },
        ] });
        $('apply-hint').textContent = 'Prévisualisation en cours';
        log('Lecture des prix actuels de 2027 pour comparaison…');
    }
    if (stage === 'planned' || stage === 'applied') {
        const rules = [
            ['Vacances d\'hiver · zones A, B, C · samedi', 398, 4, 100],
            ['Vacances d\'hiver · zones A, B, C · autres jours', 220, 24, 92],
            ['Vacances d\'été · zones A, B, C · samedi', 355, 9, 100],
            ['Vacances d\'été · zones A, B, C · autres jours', 178, 53, 96],
            ['Hors vacances · entre Noël et hiver · samedi', 237, 5, 80],
            ['Hors vacances · entre Noël et hiver · autres jours', 118, 30, 97],
        ];
        const tbody = $('rules-table').querySelector('tbody');
        for (const [k, p, n, s] of rules) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${k}</td><td class="num">${p}</td><td class="num">${n}</td><td class="num share"><i style="--w:${s}%"></i>${s} %</td>`;
            tbody.append(tr);
        }
        $('rules-details').hidden = false;
        $('apply').disabled = false;
        $('plan-summary').textContent = '212 nuits à modifier en 14 opérations · 96 déjà au bon prix · 57 ignorées';
        const ops = [
            ['2027-02-06', '2027-03-07', 29, '<span class="days">autres</span> 220<br><span class="days">sam</span> 398'],
            ['2027-03-08', '2027-04-09', 33, '<span class="days">autres</span> 118<br><span class="days">sam</span> 237'],
            ['2027-04-10', '2027-04-25', 16, '<span class="days">autres</span> 150<br><span class="days">sam</span> 260'],
            ['2027-07-03', '2027-08-29', 58, '<span class="days">autres</span> 178<br><span class="days">sam</span> 355'],
        ];
        const pc = {};
        for (const d of eachDay('2027-01-01', '2027-12-31')) pc[d] = { state: 'ok' };
        for (const d of eachDay('2027-01-01', '2027-02-05')) pc[d] = { state: 'custom', title: 'personnalisée, conservée' };
        for (const d of eachDay('2027-02-13', '2027-02-20')) pc[d] = { state: 'ok', flags: ['reserved'] };
        ops.forEach(([f, t], i) => {
            for (const d of eachDay(f, t)) {
                if (pc[d].flags) continue;
                pc[d] = { state: stage === 'applied' ? (i < 2 ? 'ok' : i === 2 ? 'busy' : 'diff') : 'diff' };
            }
        });
        renderYearGrid($('plan-grid'), 2027, pc, { legend: [
            { state: 'ok', label: 'bon prix' }, { state: 'diff', label: 'à modifier' }, { state: 'custom', label: 'personnalisée, conservée' },
            { flags: ['reserved'], label: 'réservée' }, { state: 'ok', flags: ['past'], label: 'passée' },
        ] });
        const ul = $('skipped-list');
        for (const d of eachDay('2027-01-02', '2027-01-09')) {
            const li = document.createElement('li');
            li.textContent = `${d} · déjà personnalisée (166 au lieu de 118)`;
            ul.append(li);
        }
        $('skipped-details').hidden = false;
        log('6 règles inférées, 365 nuits projetées sur 2027', 'ok');
        log('Lecture des prix actuels de 2027 pour comparaison…');
        log('Simulation : 14 opérations, 57 nuits ignorées', 'ok');
        if (stage === 'applied') {
            log('Arrêt : Carte « Prix par nuit » introuvable dans la barre latérale', 'error');
        }
    }
</script>
</body>
</html>
